name: CI

on:
  push:
    branches: [main, "slice/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quotient_test
          POSTGRES_USER: quotient
          POSTGRES_PASSWORD: quotient_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://quotient:quotient_test_password@localhost:5432/quotient_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-at-least-32-chars-long!
      ENVIRONMENT: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          uv sync --frozen || uv sync

      - name: Run Ruff Lint
        working-directory: ./backend
        run: |
          uv run ruff check .

      - name: Run Backend Tests
        working-directory: ./backend
        run: |
          uv run pytest -v

  frontend:
    name: Frontend Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run TypeScript Check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run Vitest Tests
        working-directory: ./frontend
        run: npm run test

      - name: Run Production Build
        working-directory: ./frontend
        run: npm run build
