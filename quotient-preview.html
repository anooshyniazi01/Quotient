<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quotient — Design Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14213D;--navy2:#1B2C52;--navy3:#2B3D69;--navy4:#4A5C86;--navy5:#8793B0;
  --amber:#FCA311;--amber2:#FFD27A;--amber3:#FFEFCB;--amber4:#FFF8E8;--amberD:#B36A00;
  --ink:#14213D;--mut:#5C667D;--mut2:#8A92A5;--line:#E5E5E5;--line2:#EEEEEC;--bg2:#F5F5F3;
  --ok:#1F8A5B;--okbg:#E6F4EC;--bad:#C9382E;--badbg:#FBE9E7;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ser:'Instrument Serif',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font:400 14px/1.5 var(--sans);color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-weight:500;line-height:1.15}
.ic{flex:none;vertical-align:middle}
.mono{font-family:var(--mono);font-size:12px}
.ser{font-family:var(--ser);font-weight:400}
.mut{color:var(--mut)}.mut2{color:var(--mut2)}.amD{color:var(--amberD)}.okc{color:var(--ok)}.badc{color:var(--bad)}
.eb{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut2)}
.eb.am{color:var(--amberD)}
.tr{text-align:right}.nw{white-space:nowrap}.hide{display:none!important}
.row{display:flex;align-items:center;gap:10px}.rowb{display:flex;align-items:center;justify-content:space-between;gap:12px}
.col{display:flex;flex-direction:column;gap:10px}.wrapf{flex-wrap:wrap}.f1{flex:1;min-width:0}.gap6{gap:6px}.gap14{gap:14px}.gap20{gap:20px}
.g2,.g3,.g4,.gm{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gm{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}.gm2{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}

/* buttons */
.btn{display:inline-flex;gap:7px;align-items:center;justify-content:center;height:36px;padding:0 14px;border-radius:5px;border:1px solid var(--line);background:#fff;font:500 13px var(--sans);color:var(--navy);transition:border-color .15s,background .15s,transform .1s;white-space:nowrap}
.btn:hover{border-color:var(--navy)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--amber);border-color:var(--amber)}.btn.pri:hover{background:#ffb133;border-color:#ffb133}
.btn.dk{background:var(--navy);border-color:var(--navy);color:#fff}.btn.dk:hover{background:var(--navy3)}
.btn.gh{border-color:transparent;background:transparent}.btn.gh:hover{background:var(--bg2)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}.btn.lg{height:48px;padding:0 24px;font-size:14.5px}
.btn.dg{color:var(--bad)}.btn.dg:hover{border-color:var(--bad);background:var(--badbg)}
.btn.ond{background:transparent;border-color:rgba(255,255,255,.3);color:#fff}.btn.ond:hover{border-color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}
.ib{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;color:var(--mut)}.ib:hover{background:var(--bg2);color:var(--navy)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* form */
.fld{display:flex;flex-direction:column;gap:6px}
.lb{font:500 12px var(--sans);color:var(--navy)}
.hint{font-size:12px;color:var(--mut)}
.inp,.sel,.ta{height:38px;border:1px solid var(--line);border-radius:5px;padding:0 12px;font:400 13.5px var(--sans);width:100%;background:#fff;color:var(--navy);transition:border-color .15s,box-shadow .15s}
.ta{height:auto;padding:10px 12px;resize:vertical;min-height:70px}
.inp:focus,.sel:focus,.ta:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 3px var(--amber3)}
.inp.mono{font-family:var(--mono);font-size:12.5px}
.inp.err{border-color:var(--bad)}.inp.good{border-color:var(--ok)}
.msg{font-size:12px;display:flex;gap:5px;align-items:center}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.inw{position:relative}.inw .inp{padding-right:42px}.inw .ib{position:absolute;right:3px;top:3px}
.inw.pre .inp{padding-left:36px}.inw.pre>.ic{position:absolute;left:12px;top:12px;color:var(--mut2)}
.sw{width:36px;height:20px;border-radius:10px;background:#CFCFCF;position:relative;transition:background .2s;flex:none}
.sw::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw.on{background:var(--navy)}.sw.on::after{transform:translateX(16px);background:var(--amber)}
.ck{width:18px;height:18px;border:1.5px solid #B5B9C4;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:transparent}
.ck.on{background:var(--navy);border-color:var(--navy);color:var(--amber)}
input[type=range]{accent-color:var(--amber);width:100%}

/* tags */
.bd{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:3px;font:500 11px var(--sans);background:var(--bg2);color:var(--navy);white-space:nowrap}
.bd.ok{background:var(--okbg);color:var(--ok)}.bd.bad{background:var(--badbg);color:var(--bad)}.bd.warn{background:var(--amber3);color:var(--amberD)}.bd.nv{background:var(--navy);color:#fff}.bd.am{background:var(--amber);color:var(--navy)}.bd.ol{background:#fff;border:1px solid var(--line)}
.bd.mono{font-family:var(--mono);font-size:10.5px;letter-spacing:.02em}
.dt{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;flex:none}.dt.w{background:var(--amber)}.dt.b{background:var(--bad)}.dt.g{background:#B5B9C4}
.dt.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,138,91,.5)}70%{box-shadow:0 0 0 6px rgba(31,138,91,0)}100%{box-shadow:0 0 0 0 rgba(31,138,91,0)}}

/* panels */
.pn{border:1px solid var(--line);background:#fff;border-radius:6px}
.pn.nv{background:var(--navy);color:#fff;border-color:var(--navy)}
.pn.am{background:var(--amber4);border-color:var(--amber2)}
.pnh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.nv .pnh{border-color:rgba(255,255,255,.12)}
.pnb{padding:18px}.pnb.t0{padding-top:0}.pnb.p0{padding:0}
.h3{font:600 14px var(--sans)}.h2{font:400 26px/1.15 var(--ser)}
.sub{color:var(--mut);font-size:12.5px}.nv .sub{color:var(--navy5)}
.hr{height:1px;background:var(--line2);margin:16px 0;border:0}
.ticks{height:8px;background:repeating-linear-gradient(90deg,var(--navy4) 0 1px,transparent 1px 8px);opacity:.5}
.ticks.l{background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 8px);opacity:1}

/* tables */
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut2);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr.rw{cursor:pointer;transition:background .12s}.tbl tr.rw:hover{background:var(--amber4)}
.tbl tr.sel td{background:var(--amber4)}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}

/* tabs / seg */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs button{padding:10px 14px;font-weight:500;color:var(--mut);position:relative;white-space:nowrap}
.tabs button:hover{color:var(--navy)}
.tabs button.on{color:var(--navy)}.tabs button.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--amber)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;padding:2px;background:#fff;gap:2px}
.seg button{padding:5px 11px;border-radius:3px;font:500 12px var(--sans);color:var(--mut)}
.seg button.on{background:var(--navy);color:#fff}
.seg.am button.on{background:var(--amber);color:var(--navy)}
.seg.onnv{background:transparent;border-color:rgba(255,255,255,.25)}.seg.onnv button{color:var(--navy5)}.seg.onnv button.on{background:var(--amber);color:var(--navy)}
.pane[hidden]{display:none}

/* dropdown filters */
.dd{position:relative;display:inline-block}
.fch{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:5px;background:#fff;font-size:12.5px;white-space:nowrap}
.fch:hover,.dd.open .fch{border-color:var(--navy)}
.fch .k{color:var(--mut2)}.fch b{font-weight:500}
.ddm{display:none;position:absolute;z-index:40;top:36px;left:0;min-width:100%;background:#fff;border:1px solid var(--navy);border-radius:5px;padding:4px;box-shadow:0 10px 30px rgba(20,33,61,.15)}
.dd.open .ddm{display:block}.dd.r .ddm{left:auto;right:0}
.ddm button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:3px;font-size:12.5px;white-space:nowrap}
.ddm button:hover{background:var(--amber4)}

/* expandable */
.exp>.eh{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;padding:12px 0}
.exp>.eb2{display:none}.exp.open>.eb2{display:block}
.exp.open>.eh .chv{transform:rotate(90deg)}.chv{transition:transform .2s}

/* meters */
.mt{position:relative;height:10px;background:var(--bg2);border-radius:2px;overflow:visible}
.mt>i{position:absolute;left:0;top:0;bottom:0;background:var(--navy);border-radius:2px;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.mt.w>i{background:var(--amber)}.mt.c>i{background:var(--bad)}
.mt::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(255,255,255,.55) 9px 10px);pointer-events:none}
.mt .th{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--navy);z-index:2}
.mt .th.c{background:var(--bad)}
.mt.thin{height:6px}
.mt.on-nv{background:rgba(255,255,255,.12)}.mt.on-nv>i{background:var(--amber)}.mt.on-nv::after{background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(20,33,61,.7) 9px 10px)}

/* charts */
.cx{display:grid;grid-template-columns:40px 1fr;grid-template-rows:auto 22px;font-size:11px;color:var(--mut2)}
.cx .yax{display:flex;flex-direction:column;justify-content:space-between;text-align:right;padding-right:8px;font:400 10.5px var(--mono);margin:-6px 0}
.cx .plot{position:relative;cursor:crosshair}
.cx svg{display:block;width:100%;height:100%;overflow:visible}
.cx .xax{grid-column:2;display:flex;justify-content:space-between;padding-top:6px;font:400 10.5px var(--mono)}
.cx .xh{position:absolute;top:0;bottom:0;width:1px;background:var(--navy);opacity:0;pointer-events:none}
.cx .tip{position:absolute;top:6px;background:var(--navy);color:#fff;padding:8px 10px;border-radius:4px;font-size:11.5px;pointer-events:none;opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5;min-width:130px}
.cx .tip b{font-weight:500;color:var(--amber2);display:block;margin-bottom:3px;font-family:var(--mono);font-size:10.5px}
.cx .tip div{display:flex;justify-content:space-between;gap:14px}
.cx .tip i{display:inline-block;width:7px;height:7px;border-radius:1px;margin-right:6px}
.cx.dk{color:var(--navy5)}.cx.dk .xh{background:#fff}.cx.dk .tip{background:#fff;color:var(--navy)}.cx.dk .tip b{color:var(--amberD)}
.bars{display:flex;align-items:flex-end;gap:3px;height:100%}
.bars>div{flex:1;display:flex;flex-direction:column-reverse;height:100%;justify-content:flex-start;min-width:2px}
.bars>div>i{display:block;width:100%}
.legd{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.legd span{display:inline-flex;align-items:center;gap:6px}.legd i{width:9px;height:9px;border-radius:2px;display:inline-block}
.nv .legd{color:var(--navy5)}
.spark{display:block;width:100%;height:28px;overflow:visible}
.hbar{display:grid;grid-template-columns:110px 1fr 74px;align-items:center;gap:12px;font-size:12.5px;padding:6px 0}
.hbar .b{height:14px;background:var(--bg2);border-radius:2px;position:relative;overflow:hidden}.hbar .b i{position:absolute;inset:0 auto 0 0;background:var(--navy);transition:width .8s}
.hbar .b i.a{background:var(--amber)}
.heat{display:grid;grid-template-columns:34px repeat(24,1fr);gap:2px;font:400 10px var(--mono);color:var(--mut2)}
.heat i{aspect-ratio:1;border-radius:2px;background:var(--amber);display:block;min-height:10px}
.heat span{display:flex;align-items:center}

/* provider mark / avatar */
.pm{display:inline-flex;align-items:center;justify-content:center;background:var(--navy);color:var(--amber);border-radius:6px;flex:none}
.pm.lt{background:var(--amber3);color:var(--navy)}
.av{width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--amber);display:inline-flex;align-items:center;justify-content:center;font:500 11px var(--sans);flex:none}
.av.lt{background:var(--amber3);color:var(--navy)}
.ag{width:34px;height:34px;border-radius:4px;border:1.5px solid var(--navy);display:inline-flex;align-items:center;justify-content:center;font:400 18px var(--ser);color:var(--navy);flex:none;position:relative;background:#fff}
.ag::after{content:'';position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;background:var(--amber)}

/* overlay: modal, drawer, toast */
#modal{position:fixed;inset:0;display:none;z-index:200;align-items:center;justify-content:center}
#modal.on{display:flex}
.mback{position:absolute;inset:0;background:rgba(20,33,61,.6);animation:fade .2s}
.mbox{position:relative;background:#fff;width:min(520px,92vw);max-height:90vh;overflow:auto;border-radius:8px;animation:rise .25s;border-top:3px solid var(--amber)}
.mbox.wide{width:min(900px,94vw)}
.mh{padding:20px 24px 0;display:flex;justify-content:space-between;gap:10px}.mb{padding:16px 24px 8px}.mf{padding:16px 24px 22px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(12px)}}
#dscrim{position:fixed;inset:0;background:rgba(20,33,61,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:150}
#dscrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100vw);background:#fff;border-left:1px solid var(--navy);transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.7,.2,1);z-index:160;overflow:auto}
#drawer.on{transform:none}
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:300;align-items:center;pointer-events:none}
.toast{background:var(--navy);color:#fff;padding:10px 16px;border-radius:5px;font-size:13px;display:flex;align-items:center;gap:9px;animation:rise .25s;box-shadow:0 10px 30px rgba(20,33,61,.3);max-width:92vw}
.toast .ic{color:var(--amber)}.toast.out{opacity:0;transition:opacity .4s}
.demo{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--amberD);background:var(--amber4);border:1px dashed var(--amber);padding:2px 6px;border-radius:3px}

/* code */
.code{background:var(--navy);color:#DDE3F2;border-radius:6px;font:400 12.5px/1.7 var(--mono);padding:16px 18px;overflow-x:auto;white-space:pre;tab-size:2}
.code .c{color:var(--navy5)}.code .s{color:var(--amber2)}.code .k{color:#fff;font-weight:500}.code .f{color:#9FC1FF}
.cwrap{position:relative}.cwrap .cp{position:absolute;right:8px;top:8px;color:var(--navy5);display:flex;gap:4px;align-items:center;font-size:11px;padding:4px 8px;border-radius:4px;border:1px solid rgba(255,255,255,.18)}
.cwrap .cp:hover{color:#fff;border-color:#fff}
.kbd{font:500 10.5px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:1px 5px;color:var(--mut);background:#fff}
.strip .kbd{background:transparent;border-color:rgba(255,255,255,.3);color:var(--navy5)}

/* ====== APP SHELL ====== */
.strip{background:var(--navy);color:#fff;height:46px;display:flex;align-items:center;gap:20px;padding:0 20px;font-size:12px;white-space:nowrap;overflow:hidden}
.strip .wm{display:flex;align-items:center;gap:8px;font:400 20px var(--ser);color:#fff;letter-spacing:.01em;cursor:pointer}
.strip .sep{width:1px;height:18px;background:rgba(255,255,255,.18)}
.strip .live{display:flex;gap:18px;color:var(--navy5);font-family:var(--mono);font-size:11.5px}.strip .live b{color:#fff;font-weight:500}
.strip .sp{flex:1}
.strip .wsb{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:4px;border:1px solid rgba(255,255,255,.18);cursor:pointer}.strip .wsb:hover{border-color:#fff}
.strip .ib{color:var(--navy5)}.strip .ib:hover{background:rgba(255,255,255,.1);color:#fff}
.strip .av{background:var(--amber);color:var(--navy)}
.nav{background:#fff;border-bottom:1px solid var(--line);display:flex;padding:0 20px;position:sticky;top:0;z-index:50;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.ng{display:flex;flex-direction:column;padding:9px 18px 0 0;margin-right:18px;border-right:1px solid var(--line2);flex:none}.ng:last-child{border:0;margin-right:0}
.ngl{font:500 9.5px var(--mono);letter-spacing:.14em;color:var(--mut2);text-transform:uppercase;margin-bottom:3px;display:flex;gap:8px;align-items:center}
.ngl::after{content:'';flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 4px)}
.ngi{display:flex}
.ni{display:flex;align-items:center;gap:7px;padding:7px 11px 12px;position:relative;font-weight:500;color:var(--mut);white-space:nowrap;border-radius:4px 4px 0 0;transition:color .15s,background .15s}
.ni:hover{color:var(--navy);background:var(--bg2)}
.ni.on{color:var(--navy);background:var(--amber4)}
.ni.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--amber)}
.ni .n{font:400 10px var(--mono);color:var(--mut2)}
.ni .cb{background:var(--navy);color:#fff;font:500 10px var(--mono);padding:0 5px;border-radius:8px;line-height:16px}
.page{max-width:1380px;margin:0 auto;padding:30px 28px 110px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.ph h1{font:400 36px/1.08 var(--ser);letter-spacing:-.005em}
.ph .eb{margin-bottom:8px;display:block}
.ph p{color:var(--mut);margin-top:6px;max-width:620px}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 0 14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.dock{position:fixed;left:16px;bottom:16px;z-index:120;display:flex;gap:8px}
.dock .btn{box-shadow:0 6px 20px rgba(20,33,61,.25)}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--mut);font-size:13px;margin-bottom:14px;cursor:pointer}.back:hover{color:var(--navy)}

/* empty */
.empty{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;padding:48px 40px;border:1px dashed #C9CCD6;border-radius:6px;background:linear-gradient(180deg,#fff,var(--bg2))}
.empty h3{font:400 28px/1.15 var(--ser);margin-bottom:8px}.empty p{color:var(--mut);max-width:420px;margin-bottom:18px}

/* ====== LANDING ====== */
.land{background:#fff}
.lnav{position:sticky;top:0;z-index:80;background:#fff;border-bottom:1px solid var(--line)}
.lnav .in{max-width:1320px;margin:0 auto;padding:0 28px;height:64px;display:flex;align-items:center;gap:32px}

 workspace:()=>sr('Workspace name','',`<input class="inp" style="max-width:320px" value="Meridian Labs">`)+sr('Workspace URL','quotient.app/…',`<input class="inp mono" style="max-width:320px" value="meridian-labs">`)+sr('Default environment','Windows open on this environment.',sel(['Production','Staging','Development'],'Production'))+sr('Workspace type','Team workspaces support roles and invitations.',bd('Team','nv'))+sr('Delete workspace','Permanently removes all usage data and integrations.','<button class="btn dg" data-fn="delWs">Delete workspace…</button>'),

 notif:()=>`<div class="tw"><table class="tbl"><thead><tr><th>Event</th><th style="text-align:center">Email</th><th style="text-align:center">Slack</th><th style="text-align:center">Webhook</th></tr></thead><tbody>${[['Quota warning (70%)',1,1,0],['Quota critical (90%)',1,1,1],['Budget threshold',1,0,0],['Error-rate spike',0,1,1],['New insight',1,0,0],['Weekly digest',1,0,0],['Team activity',0,0,0]].map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(v=>`<td style="text-align:center">${sw(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`,
 dev:()=>sr('Personal access tokens','For the Quotient management API.',`<div class="pn lst">${[['CI deploy · read-only','qpat_…81c2','Created Sep 2'],['Terraform provider','qpat_…e4d0','Created Jun 14']].map(([a,b,c])=>`<div class="rowb wrapf"><div><b style="font-weight:500">${a}</b><div class="sub mono">${b} · ${c}</div></div><button class="btn sm gh badc" data-fn="revoke" data-arg="${a}">Revoke</button></div>`).join('')}</div><button class="btn mt12" data-modal="newToken">${ic('plus',14)} Create token</button>`)+sr('Webhook signing secret','Verify payloads sent to your webhook channel.',`<div class="inw" style="max-width:360px"><input class="inp mono" type="password" value="whsec_9f2c7a41b3d8e5"><button class="ib" data-fn="pwtoggle">${ic('eye',16)}</button></div>`)+sr('API base URL','Management API endpoint.',`<code class="mono">https://api.quotient.dev/v2</code>`)+sr('Rate limit','Requests per minute on the management API.','<b>600</b> <span class="sub">/ min</span>'),

};
VIEW.settings=()=>{const c=S.setCat;const cur=SET.find(x=>x[0]===c);
 const idx=`<div class="pn" style="position:sticky;top:76px;padding:8px">${SET.map(([id,l,i],n)=>`<button class="row itm ${id===c?'on':''}" style="width:100%;padding:10px 12px;border-radius:4px;text-align:left;border:0" data-fn="setCat" data-arg="${id}"><span class="mono mut2" style="width:18px">${n+1}</span>${ic(i,15)}<span class="f1">${l}</span></button>`).join('')}</div>`;
 return pageH('Settings','Preferences and controls.','Configure your account, workspace and how Quotient behaves.')+`<div class="g2" style="grid-template-columns:minmax(0,.55fr) minmax(0,2.4fr);align-items:start">${idx}<div><div class="rowb" style="padding-bottom:12px;border-bottom:1px solid var(--navy)"><h2 class="h2" style="font-size:32px">${cur[1]}</h2><span class="mono mut2">${String(SET.indexOf(cur)+1).padStart(2,'0')} / 09</span></div><div>${SETC[c]()}</div></div></div>`;
};
FN.setCat=a=>{S.setCat=a;rerender();if(innerWidth<940)scrollTo(0,0)};
FN.delWs=()=>confirmM('Delete Meridian Labs?','All providers, applications, integrations and usage data will be permanently removed.','Delete workspace','Workspace deleted');
FN.delData=()=>confirmM('Delete usage data?','Request history and aggregates will be permanently erased.','Delete data','Data deleted');
FN.resetAll=()=>confirmM('Reset configuration?','All alert rules and custom limits return to defaults.','Reset','Configuration reset');
MODAL.newToken=()=>modal(`${mHead('Create access token')}<div class="mb col" style="gap:14px">${fld('Name','<input class="inp" placeholder="e.g. CI deploy">')}${fld('Scope','<select class="sel"><option>Read-only</option><option>Read and write</option></select>')}${fld('Expires','<select class="sel"><option>90 days</option><option>1 year</option><option>Never</option></select>')}</div><div class="mf"><button class="btn" data-close>Cancel</button><button class="btn pri" data-close data-demo="Token created">Create token</button></div>`);

extra.textContent='.hero h1{isolation:isolate}.cap-view .conf i.on{background:#fff}.cap-view .conf i{background:rgba(255,255,255,.2)}.nv .conf i.on{background:#fff}';
document.head.append(extra);
if(!location.hash)location.hash='#/landing';
route();
